# [打开 .github/workflows/daily_task.yml 修改]

name: Auto News Report (Daily/Weekly/Monthly)

on:
  schedule:
    # 每天早上 06:30 (UTC) = 南非 08:30 运行
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 新增：允许 workflow 把 data/history 写回仓库

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # 新增：拉取完整历史而非浅克隆，避免 push 时因 shallow clone 报错
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # === 🔥 核心修改：智能判断运行模式 ===
      - name: Determine Run Mode
        id: set_mode
        run: |
          # 获取当前日期的"日"(01-31) 和 "周几"(1-7, 1是周一)
          DAY_OF_MONTH=$(date +%d)
          DAY_OF_WEEK=$(date +%u)
          
          if [ "$DAY_OF_MONTH" == "01" ]; then
            echo "Today is the 1st. Mode: MONTHLY"
            echo "MODE=MONTHLY" >> $GITHUB_ENV
          elif [ "$DAY_OF_WEEK" == "1" ]; then
            echo "Today is Monday. Mode: WEEKLY"
            echo "MODE=WEEKLY" >> $GITHUB_ENV
          else
            echo "Normal day. Mode: DAILY"
            echo "MODE=DAILY" >> $GITHUB_ENV
          fi

      # 新增：把上次运行 push 回来的历史归档拉下来，供本次趋势计算使用
      # （首次运行时 data/history 还不存在，属正常情况，不报错）
      - name: Restore history archive
        run: |
          mkdir -p data/history
          echo "当前已有历史归档 $(ls data/history | wc -l) 份"

      # 运行脚本时，Mode 会自动注入到 config.py 中
      - name: Run Scraper
        env:
          REPORT_MODE: ${{ env.MODE }}
        run: python 1_scrape.py

      - name: Run Analyze
        env:
          REPORT_MODE: ${{ env.MODE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python 2_analyze.py

      - name: Send Email
        env:
          REPORT_MODE: ${{ env.MODE }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python 3_email.py

      # 新增：无论前面步骤是否失败，都尝试把当天新增的历史归档 commit 回仓库
      # 这样即使 Send Email 失败，趋势数据也不会丢
      - name: Persist history archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          if git diff --cached --quiet; then
            echo "没有新的历史归档需要提交"
          else
            git commit -m "chore: archive $(date +%F) news analysis [skip ci]"
            git push
          fi

      # 新增：任一环节失败时给自己发一封告警邮件，避免管道静默挂掉却没人知道
      - name: Notify on failure
        if: failure()
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python -c "
          import smtplib, os
          from email.mime.text import MIMEText
          msg = MIMEText('mybb 自动情报管道今日运行失败，请查看 GitHub Actions 日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          msg['Subject'] = '⚠️ mybb 管道运行失败'
          msg['From'] = os.environ['SENDER_EMAIL']
          msg['To'] = os.environ['RECEIVER_EMAIL']
          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(os.environ['SENDER_EMAIL'], os.environ['SENDER_PASSWORD'])
              s.send_message(msg)
          " || echo "告警邮件也发送失败，忽略"
